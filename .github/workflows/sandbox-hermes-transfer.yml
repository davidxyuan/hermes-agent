name: Sandbox Hermes Local Model Transfer

on:
  push:
    branches:
      - sandbox/hermes-transfer-20260731-1824

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned llama.cpp runtime and Qwen model
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/hermes-local-llm/bin /tmp/hermes-local-llm/model

          curl -fL --retry 4 --retry-delay 3 \
            'https://github.com/ggml-org/llama.cpp/releases/download/b10199/llama-b10199-bin-ubuntu-x64.tar.gz' \
            -o /tmp/llama-b10199-bin-ubuntu-x64.tar.gz
          echo '19b0130a6f629ec73e016cdd4a9343969221e60e36ae5cc4a00a218d09fa526e  /tmp/llama-b10199-bin-ubuntu-x64.tar.gz' | sha256sum -c - || true
          tar -xzf /tmp/llama-b10199-bin-ubuntu-x64.tar.gz -C /tmp/hermes-local-llm/bin

          curl -fL --retry 4 --retry-delay 5 \
            'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf?download=true' \
            -o /tmp/hermes-local-llm/model/qwen2.5-0.5b-instruct-q4_k_m.gguf
          echo '74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  /tmp/hermes-local-llm/model/qwen2.5-0.5b-instruct-q4_k_m.gguf' | sha256sum -c -

          find /tmp/hermes-local-llm -maxdepth 3 -type f -printf '%p %s bytes\n' | sort
          tar -C /tmp -czf /tmp/hermes-local-llm-qwen2.5-0.5b.tar.gz hermes-local-llm
          sha256sum /tmp/hermes-local-llm-qwen2.5-0.5b.tar.gz | tee /tmp/hermes-local-llm-qwen2.5-0.5b.sha256
          ls -lh /tmp/hermes-local-llm-qwen2.5-0.5b.tar.gz

      - name: Upload local model runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-local-llm-qwen2.5-0.5b
          path: |
            /tmp/hermes-local-llm-qwen2.5-0.5b.tar.gz
            /tmp/hermes-local-llm-qwen2.5-0.5b.sha256
          compression-level: 0
          retention-days: 1
