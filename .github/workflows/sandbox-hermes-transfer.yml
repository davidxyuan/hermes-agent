name: Sandbox Hermes Qwen Instruct Chunk Transfer

on:
  push:
    branches:
      - sandbox/hermes-transfer-20260731-1824

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Download and split pinned Qwen Instruct model
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/hermes-qwen-instruct-chunks
          curl -fL --retry 5 --retry-delay 5 \
            'https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf?download=true' \
            -o /tmp/qwen2.5-1.5b-instruct-q4_k_m.gguf
          echo '6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e  /tmp/qwen2.5-1.5b-instruct-q4_k_m.gguf' | sha256sum -c -
          split -b 400M -d -a 2 \
            /tmp/qwen2.5-1.5b-instruct-q4_k_m.gguf \
            /tmp/hermes-qwen-instruct-chunks/model.part-
          sha256sum /tmp/hermes-qwen-instruct-chunks/model.part-* \
            > /tmp/hermes-qwen-instruct-chunks/chunks.sha256
          printf '6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e  qwen2.5-1.5b-instruct-q4_k_m.gguf\n' \
            > /tmp/hermes-qwen-instruct-chunks/model.sha256
          ls -lh /tmp/hermes-qwen-instruct-chunks
          test "$(find /tmp/hermes-qwen-instruct-chunks -name 'model.part-*' | wc -l)" -eq 3

      - name: Upload chunk 00
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-qwen-instruct-1.5b-part-00
          path: /tmp/hermes-qwen-instruct-chunks/model.part-00
          compression-level: 0
          retention-days: 1

      - name: Upload chunk 01
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-qwen-instruct-1.5b-part-01
          path: /tmp/hermes-qwen-instruct-chunks/model.part-01
          compression-level: 0
          retention-days: 1

      - name: Upload chunk 02
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-qwen-instruct-1.5b-part-02
          path: /tmp/hermes-qwen-instruct-chunks/model.part-02
          compression-level: 0
          retention-days: 1

      - name: Upload checksum manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-qwen-instruct-1.5b-checksums
          path: |
            /tmp/hermes-qwen-instruct-chunks/chunks.sha256
            /tmp/hermes-qwen-instruct-chunks/model.sha256
          retention-days: 1
