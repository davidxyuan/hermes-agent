name: Sandbox Hermes Qwen Coder Transfer

on:
  push:
    branches:
      - sandbox/hermes-transfer-20260731-1824

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned Qwen Coder model
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/hermes-qwen-coder-1.5b
          curl -fL --retry 5 --retry-delay 5 \
            'https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf?download=true' \
            -o /tmp/hermes-qwen-coder-1.5b/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
          echo 'cc324af070c2ecbfd324a30884d2f951a7ff756aba85cb811a6ec436933bb046  /tmp/hermes-qwen-coder-1.5b/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf' | sha256sum -c -
          tar -C /tmp -cf /tmp/hermes-qwen-coder-1.5b.tar hermes-qwen-coder-1.5b
          sha256sum /tmp/hermes-qwen-coder-1.5b.tar | tee /tmp/hermes-qwen-coder-1.5b.sha256
          ls -lh /tmp/hermes-qwen-coder-1.5b.tar

      - name: Upload Qwen Coder model
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-qwen-coder-1.5b
          path: |
            /tmp/hermes-qwen-coder-1.5b.tar
            /tmp/hermes-qwen-coder-1.5b.sha256
          compression-level: 0
          retention-days: 1
